name: Image build (multi-arch)

# Reusable: build the backend image natively per architecture, boot each one
# against Postgres (smoke), push them by digest, then publish one multi-arch
# manifest (linux/amd64 + linux/arm64) under the requested tags.
#
# Native runners, not QEMU: the build runs `npm ci` + `prisma generate` +
# `nest build`, which under emulation is several times slower and has been a
# classic source of flaky segfaults; and the smoke step must execute the
# arm64 image for real. ubuntu-24.04-arm is a standard GitHub-hosted runner
# for public repositories.
#
# Called by release-image.yml (version tags) and deploy.yml (:latest + :sha).

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build (default: the triggering commit)'
        type: string
        default: ''
      tags:
        description: 'Newline-separated tags to publish (without the image name)'
        type: string
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/inite-auth-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      # The smoke script comes from the workflow's own commit, so backfilling
      # an image for an older tag (release-image workflow_dispatch) still has it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: .ci-tools
          sparse-checkout: scripts/ci

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build (local, for the smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: inite-auth-service:smoke-${{ matrix.arch }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}

      - name: Smoke — boot against Postgres, require /health and /ready
        run: .ci-tools/scripts/ci/smoke-image.sh inite-auth-service:smoke-${{ matrix.arch }} linux/${{ matrix.arch }}

      - name: Push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max

      - name: Record digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/inite-auth-service
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the multi-arch manifest
        env:
          TAGS: ${{ inputs.tags }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          tag_args=()
          first=''
          while IFS= read -r t; do
            t="$(printf '%s' "$t" | tr -d '[:space:]')"
            [ -n "$t" ] || continue
            tag_args+=(-t "$IMAGE:$t")
            [ -n "$first" ] || first="$t"
          done <<< "$TAGS"
          [ -n "$first" ] || { echo "::error::no tags given"; exit 1; }
          sources=()
          for d in *; do sources+=("$IMAGE@sha256:$d"); done
          [ "${#sources[@]}" = 2 ] || { echo "::error::expected 2 digests, got ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$first" | tee "$RUNNER_TEMP/inspect.txt"
          for p in linux/amd64 linux/arm64; do
            grep -q "Platform: *$p" "$RUNNER_TEMP/inspect.txt" || { echo "::error::$p missing from manifest"; exit 1; }
          done
