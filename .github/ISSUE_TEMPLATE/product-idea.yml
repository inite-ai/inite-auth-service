name: 💡 Product idea
description: Something you'd like INITE Auth to make possible — in plain words. No engineering knowledge needed.
title: "[idea] "
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Describe the idea the way you'd explain it to a friend. If an AI agent
        helped (e.g. `/spec-idea` in Claude Code), paste its spec at the end.
        **Security vulnerabilities do not go here** — see [SECURITY.md](https://github.com/inite-ai/inite-auth-service/blob/main/SECURITY.md).
  - type: textarea
    id: possible
    attributes:
      label: What do you want to be possible?
      placeholder: "e.g. Let a user see which apps can still act on their behalf and revoke one with a click."
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who is it for, and why?
      description: Users signing in, operators running the service, developers connecting an app, AI agents…
    validations:
      required: true
  - type: textarea
    id: works
    attributes:
      label: How would you know it works?
      description: What would you click, call or see? Relevant standard (RFC 6749/7636/8707, OIDC, …) if you know one.
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: Spec (optional — if an agent wrote one)
      description: Problem · user-visible behaviour · API/UI change · data change · risks · out of scope · zone (green/yellow/red per AGENTS.md).
    validations:
      required: false
