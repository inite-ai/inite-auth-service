name: devcontainer

# Proves "Open in Codespaces" still yields a working environment: the dev
# container builds, its services come up, post-create installs and migrates,
# and the backend builds and passes its unit suite inside it.
on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/package-lock.json'
      - 'prisma/**'
      - 'scripts/migrate.js'
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/devcontainer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Compose builds through buildx bake, which refuses a Dockerfile outside
      # the build context ("additional privileges requested: pass
      # --allow=fs.read=/tmp/devcontainercli-…"), and the devcontainer CLI
      # writes its Dockerfile-with-features under the temp dir. COMPOSE_BAKE=false
      # no longer falls back to the classic builder (every run failed from
      # 17.11.2026). The CLI's temp dir is put inside the build context
      # (.devcontainer, docker-compose.yml's context) for this step, so bake
      # reads it with no entitlement granted.
      - name: A temp dir inside the dev container's build context
        run: mkdir -p .devcontainer/.cli-tmp

      - name: Build and run the dev container
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          TMPDIR: ${{ github.workspace }}/.devcontainer/.cli-tmp
        with:
          imageName: ghcr.io/inite-ai/inite-auth-service-devcontainer
          push: never
          runCmd: npm run build && npm test
